<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Image Storage</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>My Image Storage</h1>

        <div class="upload-box">

            <input
                type="file"
                id="imageInput"
                accept="image/*"
            >

            <button id="uploadButton">
                Upload Image
            </button>

            <p id="status"></p>

        </div>

        <h2>My Images</h2>

        <div id="gallery" class="gallery"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
